name: Heart Disease MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test_and_lint:
    name: Lint, Train & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ --count --max-line-length=127 --statistics

      - name: Run Data Acquisition & Model Training
        env:
          PYTHONPATH: src
        run: |
          python src/data_loader.py
          python src/train_lr.py
          mkdir -p models
          cp models/Logistic_Regression.joblib models/best_model.joblib

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest -v --tb=short

  docker_build_and_test:
    name: Build & Verify Docker Container
    needs: test_and_lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t heart-disease-api:latest .

      - name: Run Container & Smoke Test API
        run: |
          docker run -d --name test-api -p 8000:8000 heart-disease-api:latest
          sleep 5

          # Health check
          curl --fail http://localhost:8000/health || exit 1

          # Inference smoke test
          curl -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":63.0,"sex":1.0,"cp":3.0,"trestbps":145.0,"chol":233.0,"fbs":1.0,"restecg":0.0,"thalach":150.0,"exang":0.0,"oldpeak":2.3,"slope":0.0,"ca":0.0,"thal":1.0}' \
            --fail || exit 1

      - name: Check Container Logs
        if: always()
        run: |
          docker logs test-api
